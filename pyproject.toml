[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antivenom"
version = "0.1.0"
description = "Post-hoc surgical repair for poisoned agent memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
  "networkx>=3.4",
  "numpy>=2.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13.1",
  "httpx>=0.28",
  "pymongo>=4.10",
  "motor>=3.6",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.10", "motor>=3.6"]
llm = ["openai>=1.57", "pillow>=11.0", "pypdf>=5.1"]
voice = ["elevenlabs>=1.13"]

[project.scripts]
antivenom = "antivenom.main:app"

[tool.hatch.build.targets.wheel]
packages = ["engine/antivenom"]
