name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo is public. A key that lands here is compromised the moment it
      # is pushed, so this checks the whole history rather than the diff.
      - name: Scan history for credentials
        run: |
          if git grep -nIE \
            "sk-or-v1-[A-Za-z0-9]{20,}|fw_[A-Za-z0-9]{18,}|mongodb\+srv://[^<[:space:]]*:[^<@[:space:]]+@" \
            $(git rev-list --all) -- . ':!*.lock' ':!*package-lock.json' 2>/dev/null; then
            echo "::error::a credential-shaped string is present in git history"
            exit 1
          fi
          echo "no credentials found in history"

      - name: .env must never be tracked
        run: |
          if git log --all --full-history --oneline -- .env | grep -q .; then
            echo "::error::.env appears in git history"
            exit 1
          fi
          echo ".env has never been committed"

  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A venv rather than --system: the runner's Python is externally managed
      # and refuses system installs outright.
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev,mongo,llm]"

      # Dependency CVEs. langchain 1.3.2 shipped PYSEC-2026-2192, and a
      # transitive downgrade would silently reintroduce it, so this gates
      # rather than warns.
      - name: Audit dependencies
        run: |
          uv pip install pip-audit
          .venv/bin/pip-audit --progress-spinner off

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format
        run: .venv/bin/ruff format --check .

      - name: Typecheck
        run: .venv/bin/mypy antivenom

      # Every flag off. The suite must pass with no credentials and no network,
      # because that offline path is the demo floor and it only stays working
      # if it is the path CI exercises.
      - name: Test
        env:
          ANTIVENOM_FEATURE_MONGO: '0'
          ANTIVENOM_FEATURE_VLM: '0'
          ANTIVENOM_FEATURE_VOICE: '0'
        run: .venv/bin/pytest --cov=antivenom --cov-report=term-missing

      # The seeded scenario is a demo dependency: no children means no cascade,
      # one survivor reads as luck. Guard it like code.
      - name: Verify the demo fixture
        env:
          ANTIVENOM_FEATURE_MONGO: '0'
          ANTIVENOM_FEATURE_VLM: '0'
          ANTIVENOM_FEATURE_VOICE: '0'
        run: .venv/bin/antivenom doctor

      # The committed run drives the dashboard, so it has to stay a valid,
      # complete stream. Not a byte-diff: the run is real engine output and
      # every event carries a wall-clock timestamp, so regenerating can never
      # reproduce it exactly. What matters is that it still parses against the
      # protocol and still contains the beats the demo depends on.
      - name: Recorded run is valid and complete
        env:
          ANTIVENOM_FEATURE_MONGO: '0'
          ANTIVENOM_FEATURE_VLM: '0'
          ANTIVENOM_FEATURE_VOICE: '0'
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from antivenom.events import load_run

          events, meta = load_run(Path("data/runs/demo-run.json"))
          types = [e.type for e in events]

          required = [
              "run.started", "source.ingested", "write.risk_scored",
              "belief.written", "provenance.edge", "agent.acted",
              "ablation.culprit", "blast.summary", "belief.excised",
              "belief.survived", "surgery.completed", "run.completed",
          ]
          missing = [t for t in required if t not in types]
          assert not missing, f"recorded run is missing beats: {missing}"

          # The blast radius has to be announced before anything is cut, or the
          # surgery reads as a delete.
          assert types.index("blast.summary") < types.index("belief.excised")

          # At least two corroborated survivors, or "not a delete, a dissection"
          # has nothing on screen to point at.
          survived = [e for e in events if e.type == "belief.survived"]
          assert len(survived) >= 2, f"only {len(survived)} survivor(s) in the recorded run"
          for e in survived:
              assert e.corroborating_source_ids, f"{e.belief_id} survived with no named source"

          done = next(e for e in events if e.type == "surgery.completed")
          assert done.rr > 0.9 and done.cd < 0.1, f"RR={done.rr} CD={done.cd}"

          print(f"recorded run ok: {len(events)} events, synthetic={meta.get('synthetic')}")
          PY

      # The offline path is the demo floor, so prove the whole loop runs on it.
      - name: Full loop on the demo floor
        env:
          ANTIVENOM_FEATURE_MONGO: '0'
          ANTIVENOM_FEATURE_VLM: '0'
          ANTIVENOM_FEATURE_VOICE: '0'
        run: .venv/bin/antivenom full --local

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Parses the Python-generated fixture against the TypeScript event types.
      # This is where a cross-language contract break surfaces.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
