name: Deploy

on:
  push:
    branches: [main]
    paths: ['web/**', 'engine/data/runs/**', '.github/workflows/deploy.yml']
  pull_request:
    branches: [main]
    paths: ['web/**', 'engine/data/runs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  pages:
    name: cloudflare pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # A push to main publishes to antivenom.pages.dev. A pull request
      # publishes to its own preview URL and comments the link on the PR, so a
      # change to the cascade can be looked at before it is merged.
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy web/dist
            --project-name antivenom
            --branch ${{ github.head_ref || 'main' }}
